name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

jobs:
  validate:
    name: Verify CI for tagged commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful full CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for CI on main to complete for commit $TARGET_SHA..."
          for i in {1..90}; do
            status=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$TARGET_SHA&event=push&branch=main" --jq '.workflow_runs[0].status // "unknown"')
            conclusion=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$TARGET_SHA&event=push&branch=main" --jq '.workflow_runs[0].conclusion // "unknown"')

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed on main for commit $TARGET_SHA."
                exit 0
              else
                echo "CI finished with conclusion '$conclusion' (expected 'success')."
                exit 1
              fi
            fi

            echo "CI status is '$status' (attempt $i/90). Waiting 10s..."
            sleep 10
          done

          echo "Timed out waiting for CI on main to complete."
          exit 1

  release:
    needs: validate
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure release notes file exists
        run: |
          mkdir -p docs/release-notes
          if [ ! -f "docs/release-notes/${{ github.ref_name }}.md" ]; then
            echo "# Release ${{ github.ref_name }}" > "docs/release-notes/${{ github.ref_name }}.md"
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-preview') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
