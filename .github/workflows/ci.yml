name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore POSApp.sln

      - name: Build solution
        run: dotnet build POSApp.sln --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test tests/POSApp.Tests.Unit/POSApp.Tests.Unit.csproj --no-build --configuration Release --verbosity normal
