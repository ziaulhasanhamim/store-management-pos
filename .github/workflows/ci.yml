name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test and container validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build CSS
        run: npm run css:build
      - name: Restore dependencies
        run: dotnet restore POSApp.sln
      - name: Build solution
        run: dotnet build POSApp.sln --no-restore --configuration Release
      - name: Run unit tests
        run: dotnet run --project tests/POSApp.Tests.Unit/POSApp.Tests.Unit.csproj --no-build --configuration Release
      - name: Run PostgreSQL integration tests
        run: dotnet run --project tests/POSApp.Tests.Integration/POSApp.Tests.Integration.csproj --no-build --configuration Release
      - name: Build production container
        run: docker build --tag app-validation:${{ github.sha }} .
